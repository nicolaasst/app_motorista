name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Nenhuma dependência do Base44 no bundle
        run: "! grep -rl '@base44\\|base44Client' dist src package.json"

  edge-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: deno check + test
        working-directory: supabase/functions
        run: |
          deno check app-motorista-arquivos/index.ts app-motorista-login/index.ts
          deno test _shared app-motorista-arquivos app-motorista-login

  # Os testes de banco (pgTAP) precisam das migrations do TMS (repositório privado
  # nicolaasst/Ngs_transportes). Rodam com `npm run test:db` (supabase/tests/local/run.sh)
  # tendo o TMS clonado ao lado; para rodar aqui, configure um token de leitura do
  # repositório do TMS em TMS_REPO_TOKEN e descomente o job abaixo.
  # banco:
  #   runs-on: ubuntu-latest
  #   services:
  #     postgres: ...
